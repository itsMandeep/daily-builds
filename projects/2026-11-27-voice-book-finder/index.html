<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Book Finder</title>
  <style>
    :root { --bg:#faf7f2; --fg:#1f1d1a; --muted:#6b645a; --card:#fff; --accent:#b4532a; --line:#e7e0d5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17150f; --fg:#f2ede4; --muted:#a59d90; --card:#221f18; --accent:#e08a5f; --line:#36312a; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
    main { max-width:640px; margin:0 auto; padding:32px 16px; }
    h1 { font-size:1.6rem; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 24px; }
    form { display:flex; gap:8px; }
    input { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:inherit; }
    button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button.listening { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity:.6; } }
    #status { color:var(--muted); font-size:.9rem; min-height:1.5em; margin:12px 0; }
    ol { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
    li { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    li h2 { font-size:1.05rem; margin:0 0 2px; }
    li .author { color:var(--muted); font-size:.9rem; margin-bottom:6px; }
  </style>
</head>
<body>
  <main>
    <h1>Voice Book Finder</h1>
    <p class="sub">Say or type what you want to read about. Try "a book about food or diet".</p>
    <form id="form">
      <input id="q" placeholder="I want to read a book about…" autocomplete="off" />
      <button type="button" id="mic" title="Speak">🎤</button>
      <button type="submit">Find</button>
    </form>
    <div id="status"></div>
    <ol id="results"></ol>
  </main>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
